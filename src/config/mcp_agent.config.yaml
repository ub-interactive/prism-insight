# Committed MCP layout — keep API keys out of YAML; put them only in `.env` (`.env.example`).
# OPENAI_API_KEY, ANTHROPIC_API_KEY, FIRECRAWL_API_KEY, PERPLEXITY_API_KEY (see .env.example).
$schema: ../../schema/mcp-agent.config.schema.json

execution_engine: asyncio
logger:
  type: console
  level: info
  batch_size: 100
  flush_interval: 2
  max_queue_size: 2048
  http_timeout: 5

mcp:
  servers:
    firecrawl:
      command: "npx"
      args: ["-y", "firecrawl-mcp"]
      read_timeout_seconds: 120

    perplexity:
      command: "npx"
      args:
        [
          "-y",
          "@perplexity-ai/mcp-server",
        ]

    sqlite:
      command: "uv"
      args:
        [
          "--directory",
          "src/vendor/sqlite",
          "run",
          "mcp-server-sqlite",
          "--db-path",
          "stock_tracking_db",
        ]

    time:
      command: "uvx"
      args:
        [
          "mcp-server-time",
        ]

    yahoo_finance:
      command: "uvx"
      args: ["--from", "yahoo-finance-mcp", "yahoo-finance-mcp"]
      read_timeout_seconds: 120

openai:
  default_model: deepseek-v4
  reasoning_effort: high
  models:
    report_generation: deepseek-v4-flash
    us_journal: deepseek-v4-flash
    us_macro_analysis: deepseek-v4-flash
    us_report_filename: deepseek-v4-flash
    us_trading_decision: deepseek-v4
    us_sell_decision: deepseek-v4
    us_translation: deepseek-v4-flash

anthropic:
  default_model: claude-sonnet-4-6
  models:
    firecrawl_analyst: claude-sonnet-4-6
